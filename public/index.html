UNDJo7iBKLeg8j5MPRVKpeLQm70wW3zzxly5GlRvjlN/whvHFO9gQ1WV7qF5lZp69r19/x2+93XyavPN+Q4ijPWzi4Vy0Vx2QNntC04d9CM4znwsV5fmfr/FYPtnJVUe7auv++GTbf+wq9eEYuvxLncwbMHH3t+x7S3BQDrjWyqN4vBdjKbL3e/evf1255dPuyoU9snzekrqt7gpnpzGWwXNQDqiir3pvmIby6D1QEl4eMxv8k+3JvRYG/qF+97BPsMtu+1z2D7XvsMts9g+177DLbvtdPr/wF5VKDifhF2dwAAAABJRU5ErkJggg=="
        alt="Grupo PTM" width="52" height="52">
      <small>Diagnóstico NR-12</small>
    </div>
  </header>

  <main id="app"></main>

  <script>
    /* ===== Configuração ===== */
    // Coloque aqui o número do WhatsApp da Protmar (só dígitos, com DDI e DDD). Ex: "5544999999999"
    const WHATSAPP = "";

    const OPTIONS = [
      { label: "Sim", value: "sim" },
      { label: "Em parte", value: "parcial" },
      { label: "Não", value: "nao" },
      { label: "Não sei informar", value: "naosei" }
    ];

    // inverted: "Sim" é a resposta ruim. critical: a pior resposta já indica risco de interdição
    const QUESTIONS = [
      {
        t: "Alguma adaptação recente foi feita sem projeto e sem apreciação de risco?", h: "Mudanças em máquinas, como troca de peças, novas proteções ou alterações no processo.", inverted: true, critical: true,
        fix: "Adaptações sem projeto e sem apreciação de risco podem criar perigos novos e não têm respaldo técnico em uma fiscalização."
      },
      {
        t: "Guarda-corpo tubular está sendo contado como proteção de máquina?", h: "Grades ou barras tubulares ao redor da máquina usadas no lugar de proteções projetadas.", inverted: true, critical: true,
        fix: "Guarda-corpo evita quedas, mas não impede o acesso às zonas de perigo, por isso não é aceito como proteção de máquina."
      },
      {
        t: "As distâncias da ISO 13857 foram verificadas nas zonas de perigo?", h: "Distância mínima entre a proteção e a parte perigosa, para que mãos e braços não alcancem o perigo.", critical: false,
        fix: "Proteção fora das distâncias de segurança permite alcançar a zona de perigo, mesmo com a máquina protegida."
      },
      {
        t: "O bloqueio pneumático esvazia a linha e trava fisicamente?", h: "Ao bloquear, o ar residual é descarregado e a válvula fica travada com cadeado.", critical: true,
        fix: "Sem descarga da linha e trava física, a máquina pode se mover durante a manutenção."
      },
      {
        t: "As mangueiras e válvulas de bloqueio têm identificação visual?", h: "Etiquetas, cores ou placas indicando o que cada ponto bloqueia.", critical: false,
        fix: "Sem identificação, aumenta a chance de bloquear o ponto errado e liberar energia durante a intervenção."
      },
      {
        t: "As botoeiras de emergência são monitoradas por relé de segurança?", h: "A parada de emergência é ligada a um relé de segurança que detecta falhas no circuito.", critical: true,
        fix: "Botoeira ligada direto no comando comum pode falhar sem ninguém perceber e não parar a máquina na hora em que precisa."
      },
      {
        t: "A partida remota por supervisório tem sinalização sonora prévia?", h: "Alarme sonoro antes de a máquina ligar a partir da sala de controle.", critical: true,
        fix: "Sem aviso prévio, quem está perto da máquina não tem tempo de se afastar antes da partida."
      },
      {
        t: "O laboratório de PCTS está no inventário de máquinas?", h: "Os equipamentos do laboratório também entram no inventário da NR-12.", critical: false,
        fix: "Máquinas fora do inventário ficam fora da apreciação de risco e das adequações."
      }
    ];

    // pontos por resposta: 0 = ok, 1 = parcial / não sei, 2 = resposta ruim
    function pts(q, v) { if (v === "parcial" || v === "naosei") return 1; return v === (q.inverted ? "sim" : "nao") ? 2 : 0; }
    function worst(q, v) { return v === (q.inverted ? "sim" : "nao"); }

    const RISK_THRESHOLD = 5; // soma de pontos a partir da qual há risco

    /* ===== Estado ===== */
    let step = -2; // -2 = início, -1 = dados, 0+ = perguntas
    const dados = { nome: "", empresa: "", telefone: "", email: "", lgpd: false };
    let salvo = false;
    const answers = new Array(QUESTIONS.length).fill(null);
    const app = document.getElementById("app");

    function render() {
      if (step === -2) return renderIntro();
      if (step === -1) return renderDados();
      if (step >= QUESTIONS.length) return renderResult();
      renderQuestion();
    }

    function renderIntro() {
      app.innerHTML = `
    <h1>Sua empresa corre risco de interdição pela NR-12?</h1>
    <p class="lead">Responda ${QUESTIONS.length} perguntas rápidas sobre as máquinas da sua empresa e veja na hora se há risco de interdição e quais pontos precisam de atenção.</p>
    <ul class="facts"><li>${QUESTIONS.length} perguntas</li><li>Cerca de 2 minutos</li><li>Resultado imediato</li></ul>
    <button class="btn" id="start">Começar diagnóstico</button>`;
      document.getElementById("start").onclick = () => { step = -1; render(); };
    }

    function esc(v) { return String(v).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

    function renderDados() {
      const f = (id, label, type, auto, opt) => `<div class="field"><label for="${id}">${label}${opt ? ' <span>(opcional)</span>' : ''}</label>
    <input id="${id}" name="${id}" type="${type}" autocomplete="${auto}" value="${esc(dados[id])}"></div>`;
      app.innerHTML = `
    <div class="q-count">Antes de começar</div>
    <div class="q-title">Seus dados</div>
    <p class="q-help">Usamos essas informações para registrar seu diagnóstico e, se precisar, entrar em contato.</p>
    <form id="form" novalidate>
      <div class="fields">
        ${f("nome", "Nome", "text", "name")}
        ${f("empresa", "Empresa", "text", "organization")}
        ${f("telefone", "Telefone / WhatsApp", "tel", "tel")}
        ${f("email", "E-mail", "email", "email", true)}
        <label class="check"><input type="checkbox" id="lgpd" ${dados.lgpd ? 'checked' : ''}> Autorizo a Protmar Engenharia a entrar em contato comigo sobre este diagnóstico. <span>(opcional)</span></label>
      </div>
      <p class="err" id="err" role="alert"></p>
      <div class="nav">
        <button type="button" class="btn ghost" id="back">Voltar</button>
        <button type="submit" class="btn">Começar perguntas</button>
      </div>
    </form>`;
      document.getElementById("back").onclick = () => { step = -2; render(); };
      document.getElementById("form").onsubmit = e => {
        e.preventDefault();
        ["nome", "empresa", "telefone", "email"].forEach(k => dados[k] = document.getElementById(k).value.trim());
        const err = document.getElementById("err");
        if (!dados.nome) return err.textContent = "Preencha seu nome.";
        if (!dados.empresa) return err.textContent = "Preencha o nome da empresa.";
        if (dados.telefone.replace(/\D/g, "").length < 10) return err.textContent = "Informe um telefone com DDD.";
        if (dados.email && !/^\S+@\S+\.\S+$/.test(dados.email)) return err.textContent = "Confira o e-mail informado.";
        dados.lgpd = document.getElementById("lgpd").checked;
        enviarContato();
        step = 0; render(); window.scrollTo(0, 0);
      };
      document.getElementById("nome").focus();
    }

    /* ===== Envio de e-mails (api/enviar-email.js) ===== */
    // Falhas ficam só no console: o usuário nunca vê mensagens de erro
    function enviarEmail(tipo, extra) {
      const payload = Object.assign({
        tipo,
        nome: dados.nome,
        empresa: dados.empresa,
        telefone: dados.telefone,
        email: dados.email,
        autorizaContato: dados.lgpd ? "Sim" : "Não"
      }, extra);

      return fetch("/api/enviar-email", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
        keepalive: true
      })
        .then(r => r.json().catch(() => ({})).then(j => {
          if (!r.ok || !j.success) throw new Error(`HTTP ${r.status}: ${j.error || "falha no envio"}`);
          return true;
        }))
        .catch(error => { console.error(`Erro ao enviar e-mail (${tipo}):`, error); return false; });
    }

    // EMAIL 1: dados de contato, enviado ao sair da tela "Seus dados".
    // Só reenvia se o usuário voltar e alterar algum dado.
    let contatoEnviado = "";
    function enviarContato() {
      const chave = JSON.stringify(dados);
      if (chave === contatoEnviado) return;
      contatoEnviado = chave;
      enviarEmail("contato").then(ok => { if (!ok) contatoEnviado = ""; });
    }

    // EMAIL 2: dados + respostas, enviado ao exibir o resultado
    function salvar(risk, score) {
      if (salvo) return;
      salvo = true;
      enviarEmail("diagnostico", {
        respostas: QUESTIONS.map((q, i) => {
          const opt = OPTIONS.find(o => o.value === answers[i]);
          return { pergunta: q.t, resposta: opt ? opt.label : "Não respondida" };
        }),
        pontos: score,
        resultado: risk ? "Risco de interdição" : "Não corre risco de interdição"
      }).then(ok => { if (!ok) salvo = false; });
    }


    function renderQuestion() {
      const q = QUESTIONS[step];
      const bars = QUESTIONS.map((_, i) => `<i class="${i < step ? 'done' : i === step ? 'now' : ''}"></i>`).join("");
      app.innerHTML = `
    <div class="progress" aria-hidden="true">${bars}</div>
    <div class="q-count">Pergunta ${step + 1} de ${QUESTIONS.length}</div>
    <div class="q-title" id="qt">${q.t}</div>
    <p class="q-help">${q.h}</p>
    <div class="opts" role="radiogroup" aria-labelledby="qt">
      ${OPTIONS.map(o => `<button class="opt" role="radio" aria-checked="${answers[step] === o.value}" data-v="${o.value}"><span class="dot"></span>${o.label}</button>`).join("")}
    </div>
    <div class="nav">
      <button class="btn ghost" id="back">Voltar</button>
      <button class="btn" id="next" ${answers[step] ? '' : 'disabled'}>${step === QUESTIONS.length - 1 ? 'Ver resultado' : 'Próxima'}</button>
    </div>`;
      app.querySelectorAll(".opt").forEach(b => {
        b.onclick = () => {
          answers[step] = b.dataset.v;
          app.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-checked", x === b));
          document.getElementById("next").disabled = false;
        };
      });
      document.getElementById("back").onclick = () => { step--; render(); };
      document.getElementById("next").onclick = () => { if (answers[step]) { step++; render(); window.scrollTo(0, 0); } };
      app.querySelector(".opt").focus({ preventScroll: true });
    }

    function renderResult() {
      const opt = v => OPTIONS.find(o => o.value === v);
      const score = QUESTIONS.reduce((s, q, i) => s + pts(q, answers[i]), 0);
      const criticalFail = QUESTIONS.some((q, i) => q.critical && worst(q, answers[i]));
      const risk = criticalFail || score >= RISK_THRESHOLD;

      const issues = QUESTIONS.map((q, i) => ({ q, a: answers[i] })).filter(x => pts(x.q, x.a) > 0)
        .sort((a, b) => (b.q.critical && worst(b.q, b.a)) - (a.q.critical && worst(a.q, a.a)));

      const msg = encodeURIComponent(`Olá! Fiz o diagnóstico NR-12 no site e o resultado foi: ${risk ? 'RISCO DE INTERDIÇÃO' : 'sem risco de interdição'}. Quero falar com um especialista.`);
      const waLink = WHATSAPP ? `https://wa.me/${WHATSAPP}?text=${msg}` : "";

      app.innerHTML = `
    <section class="tag ${risk ? 'risk' : 'ok'}" aria-live="polite">
      <div class="tag-band"></div>
      <div class="tag-body">
        <p class="tag-kicker">Resultado do seu diagnóstico</p>
        <div class="tag-title">${risk ? 'Risco de interdição' : 'Não corre risco de interdição'}</div>
        <p class="tag-text">${risk
          ? 'Pelas suas respostas, suas máquinas têm pontos que costumam levar à interdição em uma fiscalização. O ideal é agir antes que isso aconteça.'
          : 'Pelas suas respostas, sua empresa está bem encaminhada na NR-12. Manter a documentação e as proteções em dia é o que garante esse resultado.'}</p>
      </div>
    </section>
    ${issues.length ? `
      <h2>${risk ? 'O que precisa de atenção' : 'Pontos para melhorar'}</h2>
      <ul class="points">
        ${issues.map(x => {
            const crit = x.q.critical && worst(x.q, x.a);
            return `<li><strong>${x.q.t}</strong>
            <span class="ans ${crit ? 'crit' : ''}">Sua resposta: ${opt(x.a).label}${crit ? ' (item crítico)' : ''}</span>
            <p>${x.a === "naosei" ? 'Vale verificar este ponto. ' : ''}${x.q.fix}</p></li>`;
          }).join("")}
      </ul>` : ``}
    <div class="cta">
      ${waLink ? `<a class="btn" href="${waLink}" target="_blank" rel="noopener">Falar com um especialista</a>` : ''}
      <button class="btn ghost" id="restart">Refazer diagnóstico</button>
    </div>
    <p class="note">Este diagnóstico é orientativo e não substitui a apreciação de risco e o laudo técnico feitos por profissional habilitado.</p>`;
      document.getElementById("restart").onclick = () => { answers.fill(null); salvo = false; step = 0; render(); window.scrollTo(0, 0); };
      salvar(risk, score);
    }
    

    render();
  </script>
</body>

</html>
